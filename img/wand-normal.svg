<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Illustration: Wohnzimmerwand im Normalbild">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1EEE8"/><stop offset="1" stop-color="#E2DDD4"/></linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98E62"/><stop offset="1" stop-color="#9C7348"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#5a4a35" flood-opacity=".25"/></filter>
    <filter id="tex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .33 0 0 0 .07 0"/></filter>
  </defs>
  <rect width="600" height="380" fill="url(#w)"/>
  <rect width="600" height="380" filter="url(#tex)"/>
  <rect y="318" width="600" height="62" fill="url(#fl)"/>
  <rect y="306" width="600" height="14" fill="#F7F5F1"/>
  <rect y="318" width="600" height="2" fill="#cfc8bc"/>
  <!-- Bild an der Wand -->
  <g filter="url(#sh)">
    <rect x="232" y="70" width="150" height="108" fill="#3d3a35"/>
    <rect x="240" y="78" width="134" height="92" fill="#f6f2ea"/>
    <path d="M248 160 L290 118 L318 140 L338 122 L366 160 Z" fill="#9fb3a8"/>
    <circle cx="344" cy="100" r="9" fill="#e7c88d"/>
  </g>
  <!-- Steckdose und Schalter -->
  <rect x="92" y="262" width="26" height="26" rx="4" fill="#fbfaf7" stroke="#d8d2c7"/>
  <circle cx="101" cy="275" r="2" fill="#c9c2b6"/><circle cx="109" cy="275" r="2" fill="#c9c2b6"/>
  <rect x="470" y="168" width="24" height="34" rx="4" fill="#fbfaf7" stroke="#d8d2c7"/>
  <!-- Heizkörper -->
  <g filter="url(#sh)">
    <rect x="420" y="232" width="140" height="62" rx="4" fill="#f4f4f2"/>
    <g stroke="#dcdcd8" stroke-width="2"><line x1="436" y1="236" x2="436" y2="290"/><line x1="452" y1="236" x2="452" y2="290"/><line x1="468" y1="236" x2="468" y2="290"/><line x1="484" y1="236" x2="484" y2="290"/><line x1="500" y1="236" x2="500" y2="290"/><line x1="516" y1="236" x2="516" y2="290"/><line x1="532" y1="236" x2="532" y2="290"/><line x1="548" y1="236" x2="548" y2="290"/></g>
  </g>
</svg>
